# newsyslog(8) TEMPLATE for the acewatch logs (docs/watch/SANDBOX.md, "Log rotation"). Installed by nobody: replace __ACEWATCH_HOME__ with acewatch's
# home (/var/acewatch as installed) and copy to /etc/newsyslog.d/acewatch.conf as root. Fields: file  owner:group  mode  keep  size(KiB)  when  flags.
# Keep 5 files, rotate at 1024 KiB, compress (J), no signal to syslogd (N), mode 600. launchd opens the log files again for every run.
__ACEWATCH_HOME__/logs/acewatch.out.log  acewatch:acewatch  600  5  1024  *  JN
__ACEWATCH_HOME__/logs/acewatch.err.log  acewatch:acewatch  600  5  1024  *  JN
__ACEWATCH_HOME__/logs/acewatch.weekly.out.log  acewatch:acewatch  600  5  1024  *  JN
__ACEWATCH_HOME__/logs/acewatch.weekly.err.log  acewatch:acewatch  600  5  1024  *  JN
